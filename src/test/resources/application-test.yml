spring:
  application:
    name: wallet-ledger-test
  datasource:
    url: ${SPRING_TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet_ledger_test}
    username: ${SPRING_DATASOURCE_USERNAME:prasanthjagadeesan}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 0

logging:
  level:
    root: INFO
    com.airtribe.wallet: INFO
